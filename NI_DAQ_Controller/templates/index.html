<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NI DAQ Controller</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e; color: #e0e0e0; min-height: 100vh;
        }
        .navbar {
            background: #16213e; padding: 12px 24px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid #0f3460;
        }
        .navbar h1 { font-size: 20px; color: #00d4ff; }
        .navbar .status { font-size: 13px; color: #888; }
        .badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge.connected { background: #1b5e20; color: #69f0ae; }
        .badge.disconnected { background: #b71c1c; color: #ff8a80; }
        .badge.ethernet { background: #0d47a1; }
        .badge.usb { background: #33691e; }
        .badge.pxi { background: #4a148c; }
        .badge.pci { background: #4e342e; }
        .badge.unknown { background: #424242; }

        .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
        
        .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
        .tabs-chassis { margin-bottom: 0; }
        .tab-btn {
            padding: 10px 20px; background: #16213e; border: none;
            color: #888; cursor: pointer; border-radius: 6px 6px 0 0;
            font-size: 14px; transition: all 0.2s;
        }
        .tab-btn:hover { background: #1a2747; color: #ccc; }
        .tab-btn.active { background: #0f3460; color: #00d4ff; font-weight: bold; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .tab-panel-chassis { display: none; }
        .tab-panel-chassis.active { display: block; }

        .tabs-module {
            display: flex; gap: 4px; margin: 12px 0 16px; flex-wrap: wrap;
            padding: 8px 0; border-bottom: 1px solid #0f3460;
        }
        .tab-btn-module {
            padding: 8px 14px; background: #1a2747; border: 1px solid #0f3460;
            color: #aaa; cursor: pointer; border-radius: 4px; font-size: 13px;
        }
        .tab-btn-module:hover { background: #243352; color: #ddd; }
        .tab-btn-module.active { background: #0f3460; color: #00d4ff; border-color: #00d4ff; font-weight: bold; }
        .tab-panel-module { display: none; }
        .tab-panel-module.active { display: block; }

        .chassis-header {
            background: #16213e; border-radius: 8px; padding: 14px 18px;
            margin-bottom: 8px; border-left: 4px solid #4caf50;
        }
        .device-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
        .device-name { font-size: 16px; font-weight: bold; color: #fff; }
        .device-type { color: #888; font-size: 13px; }
        .device-details { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #aaa; }
        .module-meta { color: #888; font-size: 12px; margin-bottom: 12px; }

        .channel-list { display: flex; flex-direction: column; gap: 8px; max-height: 65vh; overflow-y: auto; }
        .channel-row {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            background: #16213e; padding: 10px 14px; border-radius: 6px;
            border: 1px solid #0f3460;
        }
        .channel-name { font-family: 'Courier New', monospace; font-weight: bold; color: #00d4ff; min-width: 72px; }
        .channel-type { font-size: 11px; padding: 3px 8px; border-radius: 3px; background: #0d1b2a; color: #aaa; }
        .channel-type.read { color: #69f0ae; }
        .channel-type.write { color: #ffa726; }
        .channel-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1; }
        .channel-value {
            min-width: 120px; font-family: 'Courier New', monospace; font-size: 13px;
            color: #69f0ae; padding: 4px 8px; background: #0d1b2a; border-radius: 4px;
        }
        .digital-row { justify-content: space-between; }
        .digital-io-bar {
            display: flex; gap: 16px; align-items: center; flex-wrap: wrap; flex: 1;
        }
        .dio-live {
            display: flex; gap: 8px; align-items: center; min-width: 120px;
        }
        .dio-section {
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .dio-module-toolbar {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            padding: 12px 16px; margin-bottom: 10px;
            background: #16213e; border-radius: 8px; border-left: 4px solid #00d4ff;
        }
        .dio-value {
            min-width: 52px; text-align: center; font-family: 'Courier New', monospace;
            font-size: 13px; padding: 4px 8px; background: #0d1b2a; border-radius: 4px;
        }
        .dio-value.true-val { color: #69f0ae; }
        .dio-value.false-val { color: #ff8a80; }
        button.btn-sm { padding: 6px 12px; font-size: 12px; }
        .ao-ac-fields { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        input, select {
            background: #0d1b2a; border: 1px solid #0f3460; color: #fff;
            padding: 6px 10px; border-radius: 4px; font-size: 13px;
        }
        input:focus, select:focus { outline: none; border-color: #00d4ff; }
        input.ao-input[type="number"] { appearance: textfield; -moz-appearance: textfield; width: 80px; }
        input.ao-input[type="number"]::-webkit-outer-spin-button,
        input.ao-input[type="number"]::-webkit-inner-spin-button {
            appearance: none; -webkit-appearance: none; margin: 0;
        }

        button {
            padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;
            font-size: 13px; font-weight: bold; transition: all 0.2s;
        }
        button:hover { opacity: 0.85; }
        .btn-primary { background: #1565c0; color: white; }
        .btn-success { background: #2e7d32; color: white; }
        .btn-danger { background: #c62828; color: white; }
        .btn-warning { background: #ef6c00; color: white; }
        .btn-secondary { background: #37474f; color: white; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }

        .dio-module-toolbar {
            display: flex; gap: 8px; flex-wrap: wrap;
            padding: 10px 14px; margin-bottom: 8px;
            background: #0f3460; border-radius: 6px;
        }
        .digital-row .channel-controls { gap: 6px; }
        .dio-status {
            min-width: 56px; font-family: 'Courier New', monospace; font-size: 13px;
            padding: 4px 8px; background: #0d1b2a; border-radius: 4px;
        }
        .dio-status.true-val { color: #69f0ae; }
        .dio-status.false-val { color: #ef9a9a; }

        .log-container {
            background: #0d1b2a; border-radius: 6px; padding: 12px;
            height: 300px; overflow-y: auto; font-family: 'Courier New', monospace;
            font-size: 12px; line-height: 1.5;
        }
        .log-entry { margin: 2px 0; }
        .log-info { color: #69f0ae; }
        .log-warning { color: #ffd54f; }
        .log-error { color: #ef9a9a; }

        .toast {
            position: fixed; bottom: 20px; right: 20px;
            padding: 12px 24px; border-radius: 6px; color: white;
            font-weight: bold; display: none; z-index: 1000;
        }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #c62828; }
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid #0f3460; border-top-color: #00d4ff;
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .tabs-usb-view {
            display: flex; gap: 4px; margin: 12px 0; flex-wrap: wrap;
            border-bottom: 1px solid #0f3460; padding-bottom: 8px;
        }
        .tab-btn-usb {
            padding: 8px 14px; background: #1a2747; border: 1px solid #0f3460;
            color: #aaa; cursor: pointer; border-radius: 4px; font-size: 13px;
        }
        .tab-btn-usb:hover { background: #243352; color: #ddd; }
        .tab-btn-usb.active { background: #0f3460; color: #00d4ff; border-color: #00d4ff; font-weight: bold; }
        .usb-view-panel { display: none; }
        .usb-view-panel.active { display: block; }

        .mapping-group {
            margin-bottom: 16px; background: #16213e; border-radius: 8px;
            border: 1px solid #0f3460; overflow: hidden;
        }
        .mapping-group-title {
            padding: 10px 14px; background: #0f3460; color: #00d4ff;
            font-weight: bold; font-size: 14px;
        }
        .mapping-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .mapping-table th {
            text-align: left; padding: 8px 10px; background: #0d1b2a;
            color: #888; font-weight: 600; border-bottom: 1px solid #0f3460;
        }
        .mapping-table td {
            padding: 8px 10px; border-bottom: 1px solid #0f3460; vertical-align: middle;
        }
        .mapping-table tr:last-child td { border-bottom: none; }
        .mapping-table .ni-line { font-family: 'Courier New', monospace; color: #00d4ff; font-weight: bold; }

        .port-select-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px; padding: 12px 0;
        }
        .port-select-item {
            display: flex; align-items: center; gap: 8px;
            background: #16213e; padding: 10px 12px; border-radius: 6px; border: 1px solid #0f3460;
        }
        .port-select-item input { width: auto; }

        .diag-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
            gap: 8px; padding: 12px 0;
        }
        .diag-port {
            text-align: center; padding: 12px 8px; border-radius: 6px;
            font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold;
        }
        .diag-port.ok { background: #1b5e20; color: #69f0ae; }
        .diag-port.fail { background: #b71c1c; color: #ff8a80; }
        .diag-port.pending { background: #37474f; color: #aaa; }

        .diag-line-grid {
            display: grid; grid-template-columns: 52px repeat(12, 1fr);
            gap: 3px; font-size: 11px; margin-top: 12px; overflow-x: auto;
        }
        .diag-line-grid .hdr {
            background: #0d1b2a; color: #888; padding: 6px 4px; text-align: center;
            font-weight: bold; border-radius: 3px;
        }
        .diag-line-cell {
            text-align: center; padding: 5px 2px; border-radius: 3px;
            font-family: 'Courier New', monospace; font-size: 10px;
        }
        .diag-line-cell.ok { background: #1b5e20; color: #69f0ae; }
        .diag-line-cell.fail { background: #b71c1c; color: #ff8a80; }
        .diag-line-cell.pending { background: #37474f; color: #aaa; }
        .diag-line-cell.testing { background: #e65100; color: #fff; animation: diag-pulse 0.8s infinite; }
        .diag-line-cell.skip { background: #1a1a2e; color: #444; }
        @keyframes diag-pulse { 50% { opacity: 0.6; } }

        .port-lines-block {
            background: #16213e; border: 1px solid #0f3460; border-radius: 8px;
            margin-bottom: 10px; overflow: hidden;
        }
        .port-lines-header {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            background: #0f3460; cursor: pointer; user-select: none;
        }
        .port-lines-header input { width: auto; }
        .port-lines-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
            padding: 10px 12px;
        }
        .line-select-item {
            display: flex; align-items: center; gap: 6px; font-size: 12px;
            font-family: 'Courier New', monospace;
        }
        .line-select-item input { width: auto; }

        .port-section-title {
            color: #00d4ff; font-size: 13px; font-weight: bold;
            margin: 12px 0 6px; padding-left: 4px;
        }

        @media (max-width: 768px) {
            .container { padding: 8px; }
            .channel-controls { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div>
            <h1>🔧 NI DAQ Controller</h1>
            <div class="status" id="statusBar">Initializing...</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
            <span id="deviceCount" style="font-size:13px;color:#888;">Devices: 0</span>
            <button class="btn-primary" onclick="refreshDevices(true)">🔄 Refresh</button>
        </div>
    </nav>

    <div class="container">
        <div class="tabs tabs-chassis" id="tabContainer">
            <button class="tab-btn active" onclick="switchChassisTab('dashboard', this)">📊 Dashboard</button>
        </div>
        
        <div id="dashboard" class="tab-panel active">
            <div id="deviceCards"></div>
            <div style="margin-top:16px;">
                <h3 style="color:#00d4ff;margin-bottom:8px;">📝 System Log</h3>
                <div class="log-container" id="logContainer"></div>
            </div>
        </div>
        
        <div id="devicePanels"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/static/daq_usb_config.js"></script>
    <script>
        let currentTab = 'dashboard';
        let devicesLoaded = false;
        window._deviceStore = [];
        window._diagRunning = {};
        window._dioWriteLock = {};

        document.addEventListener('DOMContentLoaded', () => {
            loadDevices();
            document.addEventListener('click', (e) => {
                const btn = e.target.closest('.dio-write-btn');
                if (!btn) return;
                e.preventDefault();
                e.stopPropagation();
                if (btn.disabled) return;
                writeDigitalByChannel(
                    parseInt(btn.dataset.di, 10),
                    parseInt(btn.dataset.mi, 10),
                    btn.dataset.channel,
                    btn.dataset.dioId,
                    btn.dataset.state === 'true'
                );
            });
        });

        function showToast(msg, type='success') {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = `toast ${type}`; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function switchChassisTab(tabId, btn) {
            currentTab = tabId;
            document.querySelectorAll('#tabContainer .tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel, .tab-panel-chassis').forEach(p => p.classList.remove('active'));
            if (btn) btn.classList.add('active');
            const panel = document.getElementById(tabId);
            if (panel) panel.classList.add('active');
            if (tabId !== 'dashboard') {
                const firstMod = panel?.querySelector('.tab-btn-module');
                if (firstMod) firstMod.click();
            }
        }

        function switchModuleTab(chassisIdx, moduleIdx, btn) {
            const chassisPanel = document.getElementById(`chassis-${chassisIdx}`);
            if (!chassisPanel) return;
            chassisPanel.querySelectorAll('.tab-btn-module').forEach(b => b.classList.remove('active'));
            chassisPanel.querySelectorAll('.tab-panel-module').forEach(p => p.classList.remove('active'));
            if (btn) btn.classList.add('active');
            const modPanel = document.getElementById(`chassis-${chassisIdx}-mod-${moduleIdx}`);
            if (modPanel) modPanel.classList.add('active');
        }

        async function apiCall(endpoint, method='GET', body=null, timeoutMs=8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const opts = { method, headers: {'Content-Type': 'application/json'}, signal: controller.signal };
                if (body) opts.body = JSON.stringify(body);
                const resp = await fetch(endpoint, opts);
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || 'API error');
                return data;
            } catch (e) {
                const msg = e.name === 'AbortError' ? 'Request timed out' : e.message;
                showToast(msg, 'error');
                return null;
            } finally {
                clearTimeout(timer);
            }
        }

        async function loadDevices() {
            const cached = await apiCall('/api/devices', 'GET', null, 5000);
            if (cached) applyDeviceData(cached);
            const fresh = await apiCall('/api/devices?refresh=1', 'GET', null, 45000);
            if (fresh) {
                applyDeviceData(fresh);
            } else if (!cached) {
                document.getElementById('deviceCount').textContent = 'Devices: 0';
                document.getElementById('statusBar').textContent = 'Scan failed';
                showToast('Request timed out', 'error');
            }
        }

        async function refreshDevices(rescan = false) {
            if (rescan) {
                document.getElementById('deviceCount').innerHTML = 'Devices: <span class="spinner"></span>';
                document.getElementById('statusBar').textContent = 'Scanning hardware…';
            }
            const url = rescan ? '/api/devices?refresh=1' : '/api/devices';
            const data = await apiCall(url, 'GET', null, rescan ? 45000 : 8000);
            if (!data) {
                if (rescan) {
                    const cached = await apiCall('/api/devices', 'GET', null, 5000);
                    if (cached) {
                        applyDeviceData(cached);
                        showToast('Scan timed out — showing last cached devices', 'error');
                        return;
                    }
                    document.getElementById('deviceCount').textContent = 'Devices: 0';
                    document.getElementById('statusBar').textContent = 'Scan failed';
                }
                return;
            }
            applyDeviceData(data);
            if (rescan) showToast(`Scan complete: ${data.devices.length} device(s)`);
        }


        function applyDeviceData(data) {
            const devices = data.devices || [];
            document.getElementById('deviceCount').textContent = `Devices: ${devices.length}`;
            document.getElementById('statusBar').textContent = data.status;
            window._lastDiscoveryHints = data.hints || [];
            window._deviceStore = devices;
            renderDashboard(devices);
            renderChassisTabs(devices);
            devicesLoaded = true;
            updateLog(data.log);
        }

        function connectionBadgeClass(type) {
            const t = (type || 'unknown').toLowerCase();
            if (t.includes('pci')) return 'pci';
            return t;
        }

        function formatConnectionSummary(devices) {
            const counts = {};
            devices.forEach(d => {
                const t = d.connection_type || 'Unknown';
                counts[t] = (counts[t] || 0) + 1;
            });
            return Object.entries(counts)
                .map(([t, n]) => `${n} ${t}`)
                .join(', ');
        }

        function renderDashboard(devices) {
            const container = document.getElementById('deviceCards');
            if (devices.length === 0) {
                const hints = (window._lastDiscoveryHints || []).map(h => `<p style="margin-top:8px;font-size:13px;color:#aaa;">${h}</p>`).join('');
                container.innerHTML = `
                    <div style="text-align:center;padding:40px;color:#666;">
                        <div style="font-size:48px;margin-bottom:16px;">🔌</div>
                        <h3>No NI DAQ Devices Detected</h3>
                        <p style="margin-top:8px;font-size:13px;color:#aaa;">
                            <strong>USB:</strong> plug in the device — it should appear after <strong>Refresh</strong>
                            if NI MAX sees it.<br>
                            <strong>Ethernet:</strong> add and reserve the cDAQ in NI MAX (or use Add below), then
                            <strong>Refresh</strong>.
                        </p>
                        ${hints}
                        <div style="margin-top:20px;padding:16px;background:#16213e;border-radius:8px;text-align:left;max-width:520px;margin-left:auto;margin-right:auto;">
                            <h4 style="color:#00d4ff;margin-bottom:8px;">Add Ethernet cDAQ (optional)</h4>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0;">
                                <label>IP:</label>
                                <input type="text" id="netDeviceIp" placeholder="169.254.x.x" style="width:200px;">
                                <button class="btn-primary" onclick="addNetworkDevice()">➕ Add</button>
                            </div>
                        </div>
                    </div>`;
                return;
            }
            const summary = formatConnectionSummary(devices);
            container.innerHTML = `
                <div style="padding:16px 20px;background:#16213e;border-radius:8px;border-left:4px solid #4caf50;">
                    <p style="font-size:14px;color:#ccc;">
                        <strong style="color:#69f0ae;">${devices.length}</strong> device(s) connected
                        ${summary ? `(${summary})` : ''}.
                        Use <strong>USB</strong> / <strong>Ethernet</strong> tabs → per-line <strong>True/False</strong>, or <strong>All True</strong> / <strong>All False</strong>.
                    </p>
                </div>`;
        }

        function deviceTabLabel(device, deviceIdx, allDevices) {
            const conn = device.connection_type || 'Unknown';
            if (conn === 'USB') {
                const usbNum = allDevices
                    .slice(0, deviceIdx + 1)
                    .filter(d => d.connection_type === 'USB').length;
                const usbTotal = allDevices.filter(d => d.connection_type === 'USB').length;
                return usbTotal > 1 ? `USB ${usbNum}` : 'USB';
            }
            if (conn === 'Ethernet') {
                return `Ethernet - ${device.name}`;
            }
            return `Device ${deviceIdx + 1}`;
        }

        function moduleTabLabel(displayIdx) {
            return `NI DAQ ${displayIdx + 1}`;
        }

        function shortDigitalName(ch) {
            const parts = ch.split('/');
            const port = parts.find(p => /^port\d+$/i.test(p));
            const line = parts.find(p => /^line\d+$/i.test(p));
            if (port && line) {
                return `${port.replace(/^port/i, 'P')}/${line.replace(/^line/i, 'L')}`;
            }
            return shortChannelName(ch);
        }

        function digitalChannelsForModule(mod) {
            return mod.do_channels || [];
        }

        function moduleHasDigital(mod) {
            return (mod.do_channels?.length || 0) > 0;
        }

        function shortChannelName(ch) {
            return (ch.split('/').pop() || ch).replace(/^line/, 'P');
        }

        function moduleHasChannels(mod) {
            return mod.ai_channels?.length || mod.ao_channels?.length || moduleHasDigital(mod);
        }

        function isUsbDigitalModule(device, mod) {
            return (device.connection_type === 'USB') && moduleHasDigital(mod);
        }

        function dioRowId(di, mi, channel) {
            return `${di}_${mi}_ch_${channel.replace(/\//g, '_')}`;
        }

        function dioStatusHtml(id) {
            return `<span class="dio-value" data-dio-key="${id}">--</span>`;
        }

        function applyDigitalStateByChannel(di, mi, channel, value) {
            setDigitalValueByKey(dioRowId(di, mi, channel), value);
            const mod = window._deviceStore[di]?.modules?.[mi];
            if (!mod) return;
            const ci = digitalChannelsForModule(mod).indexOf(channel);
            if (ci >= 0) setDigitalValue(`dio_val_${di}_${mi}_dio_${ci}`, value);
        }

        function dioWriteButtons(di, mi, channel, id) {
            const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
            return `
                <button type="button" class="btn-success btn-sm dio-write-btn"
                    data-di="${di}" data-mi="${mi}" data-channel="${esc(channel)}"
                    data-dio-id="${esc(id)}" data-state="true">True</button>
                <button type="button" class="btn-danger btn-sm dio-write-btn"
                    data-di="${di}" data-mi="${mi}" data-channel="${esc(channel)}"
                    data-dio-id="${esc(id)}" data-state="false">False</button>`;
        }

        function filteredChannelsByPort(mod, deviceName) {
            return filterChannelsBySavedLines(digitalChannelsForModule(mod), deviceName);
        }

        function renderDigitalRow(di, mi, channel, label) {

                    html += renderDigitalRow(di, mi, ch, label);

        function mappingUsesOhm(kind) {
            return kind === 'RTD' || kind === 'POT';

        function renderMappingView(di, mi, mod, deviceName, kind) {
            const groups = DAQ_USB_CONFIG[kind] || [];
            const doCh = digitalChannelsForModule(mod);
            const withOhm = mappingUsesOhm(kind);
            let html = `<p style="color:#888;font-size:12px;margin-bottom:10px;">
                NI line <strong>P{port}.{line}</strong> — close NI MAX Test Panel before writing.</p>`;

                    : grp.title;
                html += `<div class="mapping-group">
                    <div class="mapping-group-title">${groupLabel}</div>
                    <table class="mapping-table">
                        <thead><tr>`;
                if (withOhm) {
                    html += '<th>Ω</th>';
                } else {
                    html += '<th>Ch</th>';
                }
                html += `<th>Relay</th><th>Net</th><th>J23 Pin</th><th>NI Line</th><th>STATUS</th><th></th>
                        </tr></thead><tbody>`;
                for (const row of grp.rows) {
                    const ch = resolveNiChannel(deviceName, doCh, row.niLine);
                    const id = ch ? dioRowId(di, mi, ch) : `unmap_${row.relay}`;
                    const parsed = parseNiLine(row.niLine);
                    const niLabel = parsed ? `P${parsed.port}.${parsed.line}` : row.niLine;
                    const firstCol = withOhm ? row.ohm : (row.ch != null ? row.ch : row.channel);
                    html += `<tr>
                        <td>${firstCol ?? '—'}</td><td>${row.relay}</td><td>${row.net}</td>
                        <td>${row.pin}</td>

        function flushUi() {
            return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }

        async function runPortDiagnostics(di, mi) {
            const runKey = `${di}_${mi}`;
            if (window._diagRunning[runKey]) {
                showToast('Diagnostics already running', 'error');
                return;
            }
            window._diagRunning[runKey] = true;
            const grid = document.getElementById(`diag_grid_${di}_${mi}`);
            const summary = document.getElementById(`diag_summary_${di}_${mi}`);
            if (!grid) {
                window._diagRunning[runKey] = false;
                return;
            }
            let html = '<div class="diag-line-grid"><div class="hdr">L/P</div>';
            for (let p = 0; p < 12; p++) html += `<div class="hdr">P${p}</div>`;
            for (let l = 0; l < 8; l++) {
                html += `<div class="hdr">.${l}</div>`;
                for (let p = 0; p < 12; p++) {
                    html += `<div class="diag-line-cell pending" id="diag_${di}_${mi}_${p}_${l}">…</div>`;
                }
            }
            html += '</div>';
            grid.innerHTML = html;
            if (summary) summary.textContent = 'Starting line-by-line test…';
            let ok = 0;
            let total = 0;
            try {
            for (let p = 0; p < 12; p++) {
                for (let l = 0; l < 8; l++) {
                    const el = document.getElementById(`diag_${di}_${mi}_${p}_${l}`);
                    if (!el) continue;
                    el.className = 'diag-line-cell testing';
                    el.textContent = '▶';
                    el.title = `Testing P${p}.${l}`;
                    if (summary) summary.textContent = `Testing P${p}.${l} (${ok}/${total} OK so far)…`;
                    await flushUi();
                    const result = await apiCall('/api/do/test-line', 'POST', {
                        device_idx: di, module_idx: mi, port: p, line: l
                    }, 30000);
                    if (!result) {
                        el.className = 'diag-line-cell fail';
                        el.textContent = 'ERR';
                        continue;
                    }
                    if (!result.found) {
                        el.className = 'diag-line-cell skip';
                        el.textContent = '—';
                        el.title = 'No channel';
                        continue;
                    }
                    total++;
                    if (result.ok) {
                        el.className = 'diag-line-cell ok';
                        el.textContent = 'OK';
                        el.title = result.channel || '';
                        ok++;
                    } else {
                        el.className = 'diag-line-cell fail';
                        el.textContent = 'FAIL';
                        el.title = result.message || '';
                    }
                    await flushUi();
                }
            }
            } finally {
                window._diagRunning[runKey] = false;
            }
            const msg = `${ok}/${total} lines OK`;
            if (summary) summary.textContent = msg;
            showToast('Line test complete: ' + msg);
        }

        async function writeDigitalByChannel(di, mi, channel, id, state) {
            const lockKey = `${di}_${mi}_${channel}`;
            if (window._dioWriteLock[lockKey]) return;
            window._dioWriteLock[lockKey] = true;
            const modRoot = document.getElementById(`chassis-${di}-mod-${mi}`);
            modRoot?.querySelectorAll('.dio-write-btn').forEach(b => { b.disabled = true; });
            try {
                const result = await apiCall('/api/do/write', 'POST', {
                    device_idx: di, module_idx: mi, channel, state
                }, 30000);
                if (result) {
                    setDigitalValueByKey(id, result.state);
                    applyDigitalStateByChannel(di, mi, channel, result.state);
                    showToast(`${shortDigitalName(channel)}: ${result.state ? 'True' : 'False'}`);
                }
            } finally {
                delete window._dioWriteLock[lockKey];
                modRoot?.querySelectorAll('.dio-write-btn').forEach(b => { b.disabled = false; });
            }
        }

        function updateLog(entries) {
            const container = document.getElementById('logContainer');
            if (!entries?.length) return;
            entries.slice(-50).forEach(e => {
                const div = document.createElement('div');
                div.className = `log-entry log-${(e.level||'info').toLowerCase()}`;
                div.textContent = `[${e.time}] ${e.message}`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;

        function channelFromId(id) {
            const dioRow = document.querySelector(`[data-dio-id="${id}"]`);
            if (dioRow?.dataset?.channel) return dioRow.dataset.channel;
            const el = document.getElementById(`ao_sig_${id}`)
                || document.getElementById(`dio_val_${id}`);
            return el?.closest('.channel-row')?.dataset?.channel;
        }

        function formatAppliedOutput(result, signal, id) {
            const unit = result.unit || 'V';
            const val = result.applied_value;
            if (val === null || val === undefined) return '--';
            let text = `${val} ${unit}`;
            if (signal === 'AC') {
                const freq = document.getElementById(`ao_freq_${id}`).value;
                const wf = document.getElementById(`ao_wf_${id}`).value;
                text += ` @ ${freq} Hz ${wf}`;
            }
            return text;
        }

        async function readAIChannel(di, mi, id) {
            const channel = channelFromId(id);
            const result = await apiCall('/api/ai/read', 'POST', {
                device_idx: di, module_idx: mi, channels: [channel], rate: 1000, samples: 1
            });
            if (result) document.getElementById(`val_${id}`).textContent = result.values?.[0] || '--';
        }

        async function writeAO(di, mi, id) {
            const channel = channelFromId(id);
            const signal = document.getElementById(`ao_sig_${id}`).value;
            const value_mode = signal === 'DC' ? 'direct' : (document.getElementById(`ao_valmode_${id}`)?.value || 'direct');
            let value, freq, wf, amp;
            if (signal === 'DC') {
                value = parseFloat(document.getElementById(`ao_set_${id}`).value);
                freq = 0; wf = 'Sine'; amp = value;
            } else {
                value = 0;
                freq = parseFloat(document.getElementById(`ao_freq_${id}`).value);
                wf = document.getElementById(`ao_wf_${id}`).value;
                amp = parseFloat(document.getElementById(`ao_amp_${id}`).value);
            }
            const result = await apiCall('/api/ao/start', 'POST', {
                device_idx: di, module_idx: mi, channel, signal, value_mode,
                value, frequency: freq, waveform: wf, amplitude: amp
            });
            if (result) {
                const text = formatAppliedOutput(result, signal, id);
                showToast(`Written: ${shortChannelName(channel)} = ${text}`);
                document.getElementById(`ao_status_${id}`).textContent = text;
            }
        }

        function formatDigitalValue(val) {
            if (val === true || val === 'true') return { text: 'True', cls: 'true-val' };
            if (val === false || val === 'false') return { text: 'False', cls: 'false-val' };
            return { text: '--', cls: '' };
        }

        function setDigitalValue(elId, val) {
            const el = document.getElementById(elId);
            if (!el) return;
            const { text, cls } = formatDigitalValue(val);
            el.textContent = text;
            el.className = `dio-value ${cls}`.trim();
        }

        function setDigitalValueByKey(key, val) {
            const { text, cls } = formatDigitalValue(val);
            document.querySelectorAll(`[data-dio-key="${key}"]`).forEach(el => {
                el.textContent = text;
                el.className = `dio-value ${cls}`.trim();
            });
        }

        function applyModuleDigitalStates(di, mi, states) {
            const mod = window._deviceStore[di]?.modules?.[mi];
            if (!mod || !states) return;
            for (const [channel, value] of Object.entries(states)) {
                applyDigitalStateByChannel(di, mi, channel, value);
            }
        }


        async function writeDigitalModule(di, mi, state) {
            const device = window._deviceStore[di];
            const mod = device?.modules?.[mi];
            let channels = digitalChannelsForModule(mod);
            if (device && isUsbDigitalModule(device, mod)) {
                const filtered = filteredChannelsByPort(mod, device.name);
                if (filtered.channels.length) channels = filtered.channels;
            }
            const count = channels.length;
            if (!count) {
                showToast('No writable channels', 'error');
                return;
            }
            const result = await apiCall('/api/do/write-module', 'POST', {
                device_idx: di, module_idx: mi,
                states: Object.fromEntries(channels.map(ch => [ch, state]))
            }, 60000);
            if (result?.states) {
                applyModuleDigitalStates(di, mi, result.states);
                if (result.failed_ports?.length) {
                    showToast(
                        `Ports ${result.failed_ports.join(', ')} failed — set to Output in NI MAX`,
                        'error'
                    );
                } else {
                    showToast(`All ${count} channel(s) → ${state ? 'True' : 'False'}`);
                }
            }
        }

        async function writeDigitalChannel(di, mi, id, state) {
            const channel = channelFromId(id);
            if (!channel) {
                showToast('Channel not found', 'error');
                return;
            }
            const result = await apiCall('/api/do/write', 'POST', {
                device_idx: di, module_idx: mi, channel, state
            });
            if (result) {
                setDigitalValue(`dio_val_${id}`, result.state);
                showToast(`${shortDigitalName(channel)}: ${result.state ? 'True' : 'False'}`);
            }
        }


        async function addNetworkDevice() {
            const ip = document.getElementById('netDeviceIp')?.value?.trim();
            if (!ip) { showToast('Enter IP address', 'error'); return; }
            const result = await apiCall('/api/devices/add-network', 'POST', {
                ip_or_hostname: ip, attempt_reservation: true
            }, 15000);
            if (result) {
                showToast(`Added ${result.device_name || ip}`);
                applyDeviceData(result);
                devicesLoaded = true;
            }
        }
    </script>
</body>
</html>
